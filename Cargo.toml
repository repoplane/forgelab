[workspace]
resolver = "3"
members = ["crates/forgelab", "crates/faultproxy"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/repoplane/forgelab"
rust-version = "1.93"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"
http = "1"
rand = "0.9"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
