name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The same targets a developer runs, so CI and a laptop cannot drift apart.
      - run: make lint

      # Includes the end-to-end suite: it boots a throwaway Forgejo container through
      # testcontainers, which the runner's Docker daemon supports out of the box.
      - run: make test
